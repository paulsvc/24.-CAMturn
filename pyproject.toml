[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lathecam"
version = "0.1.0"
description = "Desktop CAD/CAM application for CNC turning targeting LinuxCNC"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
authors = [{ name = "LatheCAM Team" }]
dependencies = [
    "shapely>=2.0",
    "pyclipper>=1.3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "ezdxf>=1.1.0",
    "cadquery-ocp>=8.0",
    "vtk>=9.2",
    "PySide6>=6.5",
    "pyvista>=0.42",
    "pyvistaqt>=0.11",
]

[project.scripts]
lathecam = "lathecam.main:main"

[project.optional-dependencies]
core = [
    "shapely>=2.0",
    "pyclipper>=1.3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "ezdxf>=1.1.0",
    "vtk>=9.2",
    "PySide6>=6.5",
    "pyvista>=0.42",
    "pyvistaqt>=0.11",
]
step = [
    "cadquery-ocp>=8.0",
]
dev = [
    "pytest>=8.0",
]
all = [
    "cadquery-ocp>=8.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
